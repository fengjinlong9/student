                    <label class="block text-gray-700 text-sm font-medium mb-2">部门</label>
                    <input type="text" id="personDepartment" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus"
                           required>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-2">职位</label>
                    <input type="text" id="personPosition" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus"
                           required>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-2">联系方式</label>
                    <input type="text" id="personContact" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus"
                           required>
                </div>

                <div class="flex space-x-3 pt-4">
                    <button type="button" id="cancelPersonBtn" 
                            class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg transition-colors duration-200">
                        取消
                    </button>
                    <button type="submit" 
                            class="flex-1 bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors duration-200">
                        <span class="fa fa-save mr-2"></span>保存
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 保修申请模态框 -->
    <div id="addMaintenanceModal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="modal-backdrop absolute inset-0"></div>
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 relative z-10 transform transition-all duration-300 scale-100">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-semibold text-gray-900">
                    <span class="fa fa-wrench text-primary mr-2"></span>保修申请
                </h3>
                <button id="closeMaintenanceModal" class="text-gray-400 hover:text-gray-600">
                    <span class="fa fa-times text-xl"></span>
                </button>
            </div>

            <form id="maintenanceForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-2">申报项目 <span class="text-red-500">*</span></label>
                    <select id="maintenanceItem" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus"
                            required>
                        <option value="">请选择申报项目</option>
                        <option value="1">项目1</option>
                        <option value="2">项目2</option>
                        <option value="4">项目4</option>
                        <option value="5">项目5</option>
                    </select>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-2">申报时间 <span class="text-red-500">*</span></label>
                    <input type="date" id="maintenanceDate" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus"
                           required>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-2">申报理由 <span class="text-red-500">*</span></label>
                    <textarea id="maintenanceReason" rows="4" 
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus resize-none"
                              placeholder="请详细描述保修理由..." required></textarea>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-2">申报人</label>
                    <input type="text" id="maintenanceApplicant" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg input-focus"
                           value="student" readonly>
                </div>

                <div class="flex space-x-3 pt-4">
                    <button type="button" id="cancelMaintenanceBtn" 
                            class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg transition-colors duration-200">
                        取消
                    </button>
                    <button type="submit" 
                            class="flex-1 bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors duration-200">
                        <span class="fa fa-save mr-2"></span>提交申请
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 确认清空数据模态框 -->
    <div id="confirmClearModal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="modal-backdrop absolute inset-0"></div>
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 relative z-10 transform transition-all duration-300 scale-100">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="fa fa-exclamation-triangle text-red-500 text-2xl"></span>
                </div>
                <h3 class="text-lg font-semibold text-gray-900 mb-2">确认清空数据</h3>
                <p class="text-gray-600 text-sm">此操作将永久删除所有数据，包括人员登记和保修记录。</p>
                <p class="text-red-500 text-sm mt-2 font-medium">操作不可逆，请谨慎确认！</p>
            </div>

            <div class="flex space-x-3 pt-4">
                <button id="cancelClearBtn" 
                        class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg transition-colors duration-200">
                    取消
                </button>
                <button id="confirmClearBtn" 
                        class="flex-1 bg-accent hover:bg-red-600 text-white px-4 py-2 rounded-lg transition-colors duration-200">
                    <span class="fa fa-trash mr-2"></span>确认清空
                </button>
            </div>
        </div>
    </div>

    <!-- 通知提示框 -->
    <div id="notification" class="fixed top-4 right-4 z-50 transform transition-all duration-500 translate-x-full opacity-0">
        <div class="bg-white rounded-lg shadow-lg p-4 max-w-sm">
            <div class="flex items-center">
                <div id="notificationIcon" class="w-8 h-8 rounded-full flex items-center justify-center mr-3">
                    <span class="fa fa-check text-white"></span>
                </div>
                <div>
                    <h4 id="notificationTitle" class="font-medium text-gray-900"></h4>
                    <p id="notificationMessage" class="text-sm text-gray-600"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 数据存储
        let personnelData = JSON.parse(localStorage.getItem('personnelData')) || [];
        let maintenanceData = JSON.parse(localStorage.getItem('maintenanceData')) || [];

        // DOM元素
        const loginPage = document.getElementById('loginPage');
        const appPage = document.getElementById('appPage');
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const logoutBtn = document.getElementById('logoutBtn');
        const currentUser = document.getElementById('currentUser');

        // 页面切换
        const personnelTab = document.getElementById('personnelTab');
        const maintenanceTab = document.getElementById('maintenanceTab');
        const personnelPage = document.getElementById('personnelPage');
        const maintenancePage = document.getElementById('maintenancePage');

        // 人员登记相关
        const addPersonBtn = document.getElementById('addPersonBtn');
        const addPersonModal = document.getElementById('addPersonModal');
        const closePersonModal = document.getElementById('closePersonModal');
        const cancelPersonBtn = document.getElementById('cancelPersonBtn');
        const personForm = document.getElementById('personForm');
        const personnelTableBody = document.getElementById('personnelTableBody');
        const personnelEmptyState = document.getElementById('personnelEmptyState');

        // 保修登记相关
        const addMaintenanceBtn = document.getElementById('addMaintenanceBtn');
        const clearDatabaseBtn = document.getElementById('clearDatabaseBtn');
        const addMaintenanceModal = document.getElementById('addMaintenanceModal');
        const closeMaintenanceModal = document.getElementById('closeMaintenanceModal');
        const cancelMaintenanceBtn = document.getElementById('cancelMaintenanceBtn');
        const maintenanceForm = document.getElementById('maintenanceForm');
        const maintenanceTableBody = document.getElementById('maintenanceTableBody');
        const maintenanceEmptyState = document.getElementById('maintenanceEmptyState');
        const confirmClearModal = document.getElementById('confirmClearModal');
        const cancelClearBtn = document.getElementById('cancelClearBtn');
        const confirmClearBtn = document.getElementById('confirmClearBtn');

        // 通知
        const notification = document.getElementById('notification');
        const notificationIcon = document.getElementById('notificationIcon');
        const notificationTitle = document.getElementById('notificationTitle');
        const notificationMessage = document.getElementById('notificationMessage');

        // 初始化
        function init() {
            // 设置默认日期为今天
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('maintenanceDate').value = today;

            // 加载数据
            renderPersonnelTable();
            renderMaintenanceTable();

            // 添加事件监听器
            addEventListeners();
        }

        // 添加事件监听器
        function addEventListeners() {
            // 登录
            loginForm.addEventListener('submit', handleLogin);
            logoutBtn.addEventListener('click', handleLogout);

            // 页面切换
            personnelTab.addEventListener('click', () => switchTab('personnel'));
            maintenanceTab.addEventListener('click', () => switchTab('maintenance'));

            // 人员登记
            addPersonBtn.addEventListener('click', () => addPersonModal.classList.remove('hidden'));
            closePersonModal.addEventListener('click', () => addPersonModal.classList.add('hidden'));
            cancelPersonBtn.addEventListener('click', () => addPersonModal.classList.add('hidden'));
            personForm.addEventListener('submit', handleAddPerson);

            // 保修登记
            addMaintenanceBtn.addEventListener('click', () => addMaintenanceModal.classList.remove('hidden'));
            closeMaintenanceModal.addEventListener('click', () => addMaintenanceModal.classList.add('hidden'));
            cancelMaintenanceBtn.addEventListener('click', () => addMaintenanceModal.classList.add('hidden'));
            maintenanceForm.addEventListener('submit', handleAddMaintenance);
            clearDatabaseBtn.addEventListener('click', () => confirmClearModal.classList.remove('hidden'));
            cancelClearBtn.addEventListener('click', () => confirmClearModal.classList.add('hidden'));
            confirmClearBtn.addEventListener('click', handleClearDatabase);
        }

        // 处理登录
        function handleLogin(e) {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            // 验证登录（账号密码皆为student）
            if (username === 'student' && password === 'student') {
                currentUser.textContent = username;
                loginPage.classList.add('hidden');
                appPage.classList.remove('hidden');
                showNotification('success', '登录成功', '欢迎使用性能测试平台');
            } else {
                showNotification('error', '登录失败', '用户名或密码错误，请重试');
            }
        }

        // 处理退出
        function handleLogout() {
            appPage.classList.add('hidden');
            loginPage.classList.remove('hidden');
            usernameInput.value = '';
            passwordInput.value = '';
            showNotification('info', '已退出登录', '感谢您的使用');
        }

        // 切换标签页
        function switchTab(tab) {
            if (tab === 'personnel') {
                personnelTab.classList.add('border-primary', 'text-primary');
                personnelTab.classList.remove('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
                maintenanceTab.classList.remove('border-primary', 'text-primary');
                maintenanceTab.classList.add('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
                personnelPage.classList.remove('hidden');
                maintenancePage.classList.add('hidden');
            } else {
                maintenanceTab.classList.add('border-primary', 'text-primary');
                maintenanceTab.classList.remove('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
                personnelTab.classList.remove('border-primary', 'text-primary');
                personnelTab.classList.add('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
                maintenancePage.classList.remove('hidden');
                personnelPage.classList.add('hidden');
            }
        }

        // 处理添加人员
        function handleAddPerson(e) {
            e.preventDefault();

            const name = document.getElementById('personName').value.trim();
            const department = document.getElementById('personDepartment').value.trim();
            const position = document.getElementById('personPosition').value.trim();
            const contact = document.getElementById('personContact').value.trim();
            const registrationTime = new Date().toLocaleString();

            if (name && department && position && contact) {
                const newPerson = {
                    id: Date.now(),
                    name,
                    department,
                    position,
                    contact,
                    registrationTime
                };

                personnelData.push(newPerson);
                savePersonnelData();
                renderPersonnelTable();

                // 重置表单并关闭模态框
                personForm.reset();
                addPersonModal.classList.add('hidden');

                showNotification('success', '添加成功', '人员信息已成功添加');
            }
        }

        // 处理添加保修记录
        function handleAddMaintenance(e) {
            e.preventDefault();

            const item = document.getElementById('maintenanceItem').value;
            const date = document.getElementById('maintenanceDate').value;
            const reason = document.getElementById('maintenanceReason').value.trim();
            const applicant = document.getElementById('maintenanceApplicant').value.trim() || 'student';

            if (item && date && reason) {
                const newMaintenance = {
                    id: Date.now(),
                    item,
                    date,
                    reason,
                    applicant,
                    status: '待处理',
                    createTime: new Date().toLocaleString()
                };

                maintenanceData.push(newMaintenance);
                saveMaintenanceData();
                renderMaintenanceTable();

                // 重置表单并关闭模态框
                maintenanceForm.reset();
                document.getElementById('maintenanceDate').value = new Date().toISOString().split('T')[0];
                addMaintenanceModal.classList.add('hidden');

                showNotification('success', '提交成功', '保修申请已成功提交');
            }
        }

        // 处理清空数据库
        function handleClearDatabase() {
            personnelData = [];
            maintenanceData = [];
            savePersonnelData();
            saveMaintenanceData();
            renderPersonnelTable();
            renderMaintenanceTable();
            confirmClearModal.classList.add('hidden');
            showNotification('warning', '数据已清空', '所有记录已被永久删除');
        }

        // 渲染人员表格
        function renderPersonnelTable() {
            personnelTableBody.innerHTML = '';

            if (personnelData.length === 0) {
                personnelEmptyState.classList.remove('hidden');
                return;
            }

            personnelEmptyState.classList.add('hidden');

            personnelData.forEach(person => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50 transition-colors duration-150';
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">${person.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${person.department}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${person.position}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${person.contact}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${person.registrationTime}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="deletePerson(${person.id})" 
                                class="text-red-600 hover:text-red-900 transition-colors duration-200">
                            <span class="fa fa-trash mr-1"></span>删除
                        </button>
                    </td>
                `;
                personnelTableBody.appendChild(row);
            });
        }

        // 渲染保修表格
        function renderMaintenanceTable() {
            maintenanceTableBody.innerHTML = '';

            if (maintenanceData.length === 0) {
                maintenanceEmptyState.classList.remove('hidden');
                return;
            }

            maintenanceEmptyState.classList.add('hidden');

            maintenanceData.forEach(maintenance => {
                const statusClass = maintenance.status === '已处理' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';

                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50 transition-colors duration-150';
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">项目${maintenance.item}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${maintenance.date}</td>
                    <td class="px-6 py-4">${maintenance.reason}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${maintenance.applicant}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusClass}">
                            ${maintenance.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="toggleMaintenanceStatus(${maintenance.id})" 
                                class="text-primary hover:text-blue-900 mr-3 transition-colors duration-200">
                            <span class="fa fa-check-circle mr-1"></span>${maintenance.status === '已处理' ? '标记为待处理' : '标记为已处理'}
                        </button>
                        <button onclick="deleteMaintenance(${maintenance.id})" 
                                class="text-red-600 hover:text-red-900 transition-colors duration-200">
                            <span class="fa fa-trash mr-1"></span>删除
                        </button>
                    </td>
                `;
                maintenanceTableBody.appendChild(row);
            });
        }

        // 删除人员
        function deletePerson(id) {
            if (confirm('确定要删除这条人员记录吗？')) {
                personnelData = personnelData.filter(person => person.id !== id);
                savePersonnelData();
                renderPersonnelTable();
                showNotification('info', '已删除', '人员记录已成功删除');
            }
        }

        // 删除保修记录
        function deleteMaintenance(id) {
            if (confirm('确定要删除这条保修记录吗？')) {
                maintenanceData = maintenanceData.filter(maintenance => maintenance.id !== id);
                saveMaintenanceData();
                renderMaintenanceTable();
                showNotification('info', '已删除', '保修记录已成功删除');
            }
        }

        // 切换保修状态
        function toggleMaintenanceStatus(id) {
            const maintenance = maintenanceData.find(item => item.id === id);
            if (maintenance) {
                maintenance.status = maintenance.status === '已处理' ? '待处理' : '已处理';
                saveMaintenanceData();
                renderMaintenanceTable();
                showNotification('success', '状态更新', '保修状态已成功更新');
            }
        }

        // 保存人员数据
        function savePersonnelData() {
            localStorage.setItem('personnelData', JSON.stringify(personnelData));
        }

        // 保存保修数据
        function saveMaintenanceData() {
            localStorage.setItem('maintenanceData', JSON.stringify(maintenanceData));
        }

        // 显示通知
        function showNotification(type, title, message) {
            // 设置通知类型
            let iconClass = 'fa-check';
            let bgColor = 'bg-green-500';

            if (type === 'error') {
                iconClass = 'fa-times';
                bgColor = 'bg-red-500';
            } else if (type === 'warning') {
                iconClass = 'fa-exclamation-triangle';
                bgColor = 'bg-yellow-500';
            } else if (type === 'info') {
                iconClass = 'fa-info-circle';
                bgColor = 'bg-blue-500';
            }

            // 更新通知内容
            notificationIcon.className = `w-8 h-8 rounded-full flex items-center justify-center mr-3 ${bgColor}`;
            notificationIcon.innerHTML = `<span class="fa ${iconClass} text-white"></span>`;
            notificationTitle.textContent = title;
            notificationMessage.textContent = message;

            // 显示通知
            notification.classList.remove('translate-x-full', 'opacity-0');
            notification.classList.add('translate-x-0', 'opacity-100');

            // 3秒后隐藏通知
            setTimeout(() => {
                notification.classList.remove('translate-x-0', 'opacity-100');
                notification.classList.add('translate-x-full', 'opacity-0');
            }, 3000);
        }

        // 全局函数
        window.deletePerson = deletePerson;
        window.deleteMaintenance = deleteMaintenance;
        window.toggleMaintenanceStatus = toggleMaintenanceStatus;

        // 初始化应用
        init();
    </script>
</body>
</html>
